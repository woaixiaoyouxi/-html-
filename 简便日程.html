<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=no" />
    <title>📅 日程（无自动清理）</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f5fc; color: #1e293b; padding: 10px 6px; min-height: 100vh; display: flex; justify-content: center; }
        .app { max-width: 1400px; width:100%; background: #fff; border-radius: 28px; box-shadow: 0 16px 48px rgba(0,0,0,0.06); padding: 16px 14px 20px; display: flex; flex-direction: column; height: 96vh; max-height: 96vh; }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; padding: 0 4px 10px 4px; flex-shrink: 0; }
        .header h1 { font-size: 22px; font-weight: 650; background: linear-gradient(135deg,#1e293b,#3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.3px; }
        .header-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .btn { padding: 6px 14px; border-radius: 30px; border: none; font-size: 12px; font-weight: 500; cursor: pointer; transition: 0.15s; background: #f1f5f9; color: #1e293b; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; user-select: none; }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: #3b82f6; color: #fff; box-shadow: 0 4px 12px rgba(59,130,246,0.25); }
        .btn-success { background: #10b981; color: #fff; }
        .btn-danger { background: #fee2e2; color: #dc2626; }
        .btn-sm { font-size: 11px; padding: 4px 12px; }
        .btn-outline { background: transparent; border: 1.5px solid #e2e8f0; }
        .week-bar { display: flex; align-items: center; gap: 12px; background: #f8fafc; border-radius: 18px; padding: 6px 16px; margin-bottom: 8px; border: 1px solid #eef2f6; flex-shrink: 0; flex-wrap: wrap; }
        .week-bar .week-nav { display: flex; align-items: center; gap: 6px; }
        .week-bar .week-nav .btn-week { padding: 2px 10px; border-radius: 30px; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; }
        .week-bar .week-nav .btn-week:active { background: #eef2ff; }
        .week-bar .week-label { font-weight: 600; font-size: 15px; color: #0f172a; min-width: 80px; text-align: center; }
        .week-bar .week-tools { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; align-items: center; }
        .zoom-control { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .zoom-control input[type="range"] { width: 80px; height: 4px; -webkit-appearance: none; background: #e2e8f0; border-radius: 4px; outline: none; }
        .zoom-control input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #3b82f6; cursor: pointer; }
        .zoom-control .zoom-label { font-size: 12px; color: #475569; min-width: 36px; text-align: right; }
        .day-column.today .day-header-label { background: #dbeafe !important; color: #1e40af; font-weight: 700; border-bottom: 2px solid #3b82f6; }
        .timeline-container { display: flex; flex:1; min-height:0; border-radius:16px; border:1px solid #eef2f6; background:#fff; overflow:hidden; position:relative; }
        .days-scroll { flex:1; overflow:auto; position:relative; -webkit-overflow-scrolling:touch; display:flex; }
        .days-scroll::-webkit-scrollbar { width:4px; height:4px; }
        .days-scroll::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:8px; }
        .time-scale-col { flex: 0 0 56px; min-width: 56px; position: sticky; left: 0; z-index: 12; background: #f8fafc; border-right: 1px solid #eef2f6; display: flex; flex-direction: column; padding-top: 36px; }
        .time-scale-col .ts-header { position: absolute; top: 0; left: 0; right: 0; height: 36px; z-index: 13; background: #f8fafc; border-bottom: 1px solid #eef2f6; text-align: center; font-weight: 600; font-size: 13px; color: #475569; line-height: 36px; user-select: none; pointer-events: none; }
        .time-scale-col .ts-content { position: relative; flex: 1; min-height: 0; }
        .time-scale-col .time-label { position: absolute; right: 6px; font-size: 10px; color: #64748b; font-weight: 500; transform: translateY(-50%); white-space: nowrap; pointer-events: none; }
        .time-scale-col .time-line { position: absolute; left: 0; right: 0; height: 1px; background: #f1f5f9; pointer-events: none; }
        .time-scale-col .time-line.half { background: #f8fafc; border-top: 1px dashed #eef2f6; }
        .days-grid { display:flex; }
        .day-column { border-right:1px solid #f1f5f9; position:relative; background:#fff; flex-shrink:0; }
        .day-column:last-child { border-right:none; }
        .day-column .day-header-label { text-align:center; font-size:13px; font-weight:600; color:#475569; padding:6px 0; background:#f8fafc; border-bottom:1px solid #eef2f6; position:sticky; top:0; z-index:10; height: 36px; display: flex; align-items: center; justify-content: center; }
        .day-track { position:relative; width:100%; cursor:pointer; touch-action: none; }
        .day-track.drag-mode { cursor:grab; }
        .day-track.drag-mode:active { cursor:grabbing; }
        .event-block { position:absolute; border-radius:8px; padding:3px 5px; font-size:10px; line-height:1.2; color:#1e293b; overflow:hidden; cursor:pointer; transition:box-shadow 0.15s; border:1px solid rgba(255,255,255,0.5); box-shadow:0 1px 4px rgba(0,0,0,0.06); display:flex; flex-direction:column; justify-content:center; user-select:none; z-index:5; min-height:14px; }
        .event-block .ev-text { font-weight:500; font-size:10px; }
        .event-block .ev-time { font-size:8px; color:#64748b; }
        .drag-preview { position:absolute; border-radius:8px; background:rgba(59,130,246,0.18); border:2px dashed #3b82f6; pointer-events:none; z-index:20; display:none; opacity:0.9; }
        .drag-preview.active { display:block; }
        .hour-line { position:absolute; left:0; right:0; height:1px; background:#f1f5f9; pointer-events:none; }
        .hour-line.half { background:#f8fafc; border-top:1px dashed #eef2f6; }
        .drag-mask { position:absolute; top:0; left:0; right:0; bottom:0; z-index:40; cursor:grab; display:none; }
        .drag-mask.active { display:block; }
        .drag-mask:active { cursor:grabbing; }
        .float-indicator { position:fixed; transform:translateY(-50%); background:#1e293b; color:#fff; padding:3px 10px; border-radius:14px; font-size:12px; font-weight:600; box-shadow:0 4px 16px rgba(0,0,0,0.25); z-index:1000; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity 0.12s; }
        .float-indicator::after { content:''; position:absolute; left:-6px; top:50%; transform:translateY(-50%); border-width:5px 6px 5px 0; border-style:solid; border-color:transparent #1e293b transparent transparent; }
        .float-indicator.active { opacity:1; }
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(15,23,42,0.35); backdrop-filter:blur(6px); z-index:2000; justify-content:center; align-items:center; padding:20px; animation:fadeIn 0.2s ease; }
        .modal-overlay.active { display:flex; }
        @keyframes fadeIn { from{opacity:0;transform:scale(0.96);} to{opacity:1;transform:scale(1);} }
        .modal { background:#fff; border-radius:28px; padding:26px 28px 30px; width:380px; max-width:100%; box-shadow:0 30px 70px rgba(0,0,0,0.18); animation:slideUp 0.25s ease; max-height:90vh; overflow-y:auto; }
        @keyframes slideUp { from{transform:translateY(24px);opacity:0;} to{transform:translateY(0);opacity:1;} }
        .modal h3 { font-size:20px; font-weight:600; margin-bottom:2px; }
        .modal .modal-sub { font-size:14px; color:#64748b; margin-bottom:16px; }
        .modal .form-group { margin-bottom:14px; }
        .modal .form-group label { display:block; font-size:13px; font-weight:500; margin-bottom:4px; }
        .modal .form-group input, .modal .form-group textarea { width:100%; padding:8px 14px; border:1.5px solid #e2e8f0; border-radius:14px; font-size:14px; outline:none; background:#fafcff; }
        .modal .form-group textarea { min-height:52px; }
        .modal .form-row { display:flex; gap:12px; }
        .modal .form-row .form-group { flex:1; }
        .modal .color-options { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
        .modal .color-options .color-chip { width:30px; height:30px; border-radius:50%; cursor:pointer; border:3px solid transparent; transition:0.12s; }
        .modal .color-options .color-chip.active { border-color:#1e293b; transform:scale(1.1); }
        .modal .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
        .modal .modal-actions .btn { padding:8px 22px; font-size:14px; }
        .toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(24px); background:#1e293b; color:#fff; padding:10px 26px; border-radius:40px; font-size:14px; font-weight:500; box-shadow:0 12px 36px rgba(0,0,0,0.25); opacity:0; transition:opacity 0.25s, transform 0.3s; pointer-events:none; z-index:3000; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .import-area textarea { width:100%; min-height:120px; border-radius:14px; border:1.5px solid #e2e8f0; padding:12px; font-family:monospace; font-size:12px; resize:vertical; outline:none; }
        @media (max-width:700px) {
            .day-column .day-header-label { font-size:10px; height: 30px; padding:3px 0; }
            .time-scale-col { flex-basis:44px; min-width:44px; padding-top: 30px; }
            .time-scale-col .ts-header { height: 30px; line-height: 30px; font-size:10px; }
            .event-block { padding:2px 3px; font-size:8px; min-height:12px; }
            .event-block .ev-text { font-size:8px; }
            .event-block .ev-time { font-size:7px; }
            .modal { padding:20px 16px 24px; }
        }
        @media (max-width:420px) {
            .day-column { min-width:34px; }
            .day-column .day-header-label { font-size:9px; height: 26px; padding:2px 0; }
            .time-scale-col { flex-basis:36px; min-width:36px; padding-top: 26px; }
            .time-scale-col .ts-header { height: 26px; line-height: 26px; font-size:9px; }
            .time-scale-col .time-label { font-size:7px; right:2px; }
        }
    </style>
</head>
<body>
<div class="app">
    <header class="header">
        <h1>⏱️ 日程</h1>
        <div class="header-actions">
            <button class="btn btn-sm" id="importBtn">📥 导入</button>
            <button class="btn btn-sm" id="exportBtn">📤 导出</button>
            <button class="btn btn-sm btn-danger" id="clearWeekBtn">🗑️ 清空</button>
        </div>
    </header>
    <div class="week-bar">
        <div class="week-nav">
            <button class="btn-week" id="prevWeekBtn">‹ 前周</button>
            <span class="week-label" id="weekLabelDisplay">第 1 周</span>
            <button class="btn-week" id="nextWeekBtn">后周 ›</button>
        </div>
        <div class="zoom-control">
            <button class="btn btn-sm btn-outline" id="dragModeBtn">✋ 拖动</button>
            <input type="range" id="zoomSlider" min="50" max="200" value="100" />
            <span class="zoom-label" id="zoomPercent">100%</span>
        </div>
    </div>
    <div class="timeline-container" id="timelineContainer">
        <div class="days-scroll" id="daysScroll">
            <div class="time-scale-col" id="timeScaleCol">
                <div class="ts-header">日程</div>
                <div class="ts-content" id="tsContent"></div>
            </div>
            <div class="days-grid" id="daysGrid"></div>
            <div class="drag-preview" id="dragPreview"></div>
            <div class="drag-mask" id="dragMask"></div>
        </div>
    </div>
    <div style="margin-top:6px;font-size:11px;color:#94a3b8;text-align:center;flex-shrink:0;">
        💡 在任意空白或已有日程上拖拽即可创建新日程，松手编辑
    </div>
</div>

<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h3 id="modalTitle">📌 编辑事件</h3>
        <div class="modal-sub" id="modalSub">周一 · 08:00-09:30</div>
        <div class="form-group">
            <label>📝 备注</label>
            <textarea id="editText" placeholder="课程/事项" rows="2"></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>🎨 颜色</label>
                <div class="color-options" id="colorOptions"></div>
            </div>
            <div class="form-group" style="flex:0 0 80px;">
                <label>🏷️ 标签</label>
                <input type="text" id="editTag" placeholder="标签" maxlength="8" />
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn" id="modalDeleteBtn" style="color:#dc2626;">🗑️ 删除</button>
            <button class="btn" id="modalCancelBtn">取消</button>
            <button class="btn btn-primary" id="modalSaveBtn">💾 保存</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="importModal">
    <div class="modal">
        <h3>📥 导入数据 (JSON)</h3>
        <div class="import-area">
            <textarea id="importData" placeholder='{"weeks":{...}}'></textarea>
            <div class="import-hint">粘贴 JSON 数据</div>
        </div>
        <div class="modal-actions">
            <button class="btn" id="importCancelBtn">取消</button>
            <button class="btn btn-primary" id="importConfirmBtn">✅ 导入</button>
        </div>
    </div>
</div>

<div class="float-indicator" id="floatIndicator">08:00</div>
<div class="toast" id="toast"></div>

<script>
    (function() {
        'use strict';

        const DAY_NAMES = ['周一','周二','周三','周四','周五','周六','周日'];
        const COLORS = ['#4f46e5','#3b82f6','#06b6d4','#10b981','#f59e0b','#ef4444','#ec4899','#8b5cf6','#14b8a6','#f97316'];
        const STORAGE_KEY = 'schedule_v25_no_autoclean';
        const START_HOUR = 0, END_HOUR = 24;
        const TOTAL_MIN = (END_HOUR - START_HOUR) * 60;
        const DEFAULT_HOUR_HEIGHT = 60;

        let weeks={}, currentWeekId='w1', nextEventId=1;
        let selectedColor=COLORS[0];
        let hourHeight=DEFAULT_HOUR_HEIGHT, scaleFactor=1, dragModeActive=false;
        let editTarget=null, columnWidths={};
        let savedUserWidths=null;
        let dragState=null;

        const $=s=>document.querySelector(s);
        const daysGrid=$('#daysGrid'), daysScroll=$('#daysScroll'), timeScaleCol=$('#timeScaleCol');
        const tsContent=$('#tsContent');
        const dragPreview=$('#dragPreview'), dragMask=$('#dragMask');
        const floatIndicator=$('#floatIndicator');
        const editModal=$('#editModal'), editText=$('#editText'), editTag=$('#editTag'), modalSub=$('#modalSub');
        const modalSaveBtn=$('#modalSaveBtn'), modalCancelBtn=$('#modalCancelBtn'), modalDeleteBtn=$('#modalDeleteBtn');
        const colorOptions=$('#colorOptions'), importModal=$('#importModal'), importData=$('#importData');
        const importConfirmBtn=$('#importConfirmBtn'), importCancelBtn=$('#importCancelBtn');
        const importBtn=$('#importBtn'), exportBtn=$('#exportBtn'), clearWeekBtn=$('#clearWeekBtn');
        const toastEl=$('#toast'), weekLabelDisplay=$('#weekLabelDisplay');
        const prevWeekBtn=$('#prevWeekBtn'), nextWeekBtn=$('#nextWeekBtn'), dragModeBtn=$('#dragModeBtn');
        const zoomSlider=$('#zoomSlider'), zoomPercent=$('#zoomPercent');

        function minToPixel(m){return (m - START_HOUR*60) * (hourHeight/60);}
        function pixelToMin(p){return p * (60/hourHeight) + START_HOUR*60;}
        function totalHeight(){return TOTAL_MIN * (hourHeight/60);}
        function fmtTime(m){m=Math.round(m);const h=Math.floor(m/60), mm=m%60;if(h===24 && mm===0) return '24:00';return `${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;}

        function toast(msg,d=2000){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>toastEl.classList.remove('show'),d);}
        function esc(t){if(!t) return '';const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
        function curEvents(){if(!weeks[currentWeekId]) weeks[currentWeekId]={};return weeks[currentWeekId];}
        function dayEvents(di){return Object.values(curEvents()).filter(e=>e.dayIdx===di);}
        function addEvent(e){curEvents()[`${e.dayIdx}-${e.id}`]=e;}
        function rmEvent(di,id){delete curEvents()[`${di}-${id}`];}
        function getDefColor(){return '#4f46e5';}

        function syncHeaderHeight() {
            const dayHeader = document.querySelector('.day-header-label');
            if (!dayHeader) return;
            const h = dayHeader.offsetHeight;
            if (h > 0) {
                document.querySelector('.ts-header').style.height = h + 'px';
                document.querySelector('.ts-header').style.lineHeight = h + 'px';
                timeScaleCol.style.paddingTop = h + 'px';
            }
        }

        function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify({weeks,currentWeekId,nextEventId,hourHeight,scaleFactor,columnWidths,dragModeActive}));}
        function load(){try{const r=JSON.parse(localStorage.getItem(STORAGE_KEY));if(r){weeks=r.weeks||{};currentWeekId=r.currentWeekId||'w1';nextEventId=r.nextEventId||1;hourHeight=r.hourHeight||DEFAULT_HOUR_HEIGHT;scaleFactor=r.scaleFactor||1;columnWidths=r.columnWidths||{};dragModeActive=r.dragModeActive||false;}}catch(e){}if(!weeks[currentWeekId])weeks[currentWeekId]={};for(let i=0;i<7;i++)if(!columnWidths[i])columnWidths[i]=120;weekLabelDisplay.textContent=currentWeekId.replace('w','第 ')+' 周';zoomSlider.value=Math.round(scaleFactor*100);zoomPercent.textContent=Math.round(scaleFactor*100)+'%';updateDragUI();}
        function saveColW(){localStorage.setItem('schedule_colw_v25',JSON.stringify(columnWidths));}
        function loadColW(){try{const r=JSON.parse(localStorage.getItem('schedule_colw_v25'));if(r)columnWidths=r;}catch(e){}for(let i=0;i<7;i++)if(!columnWidths[i])columnWidths[i]=120;}
        function colW(di){return columnWidths[di]||120;}

        function autoFit(){const aw=daysScroll.clientWidth-56;if(aw<=0)return;let w=Math.floor(aw/7/scaleFactor);if(w<50)w=50;for(let i=0;i<7;i++)columnWidths[i]=w;saveColW();}
        function backupW(){if(savedUserWidths) return;savedUserWidths=JSON.parse(JSON.stringify(columnWidths));}
        function restoreW(){if(savedUserWidths){columnWidths=JSON.parse(JSON.stringify(savedUserWidths));saveColW();savedUserWidths=null;}}

        function layout(dayIdx){const evs=dayEvents(dayIdx);if(!evs.length)return[];evs.sort((a,b)=>a.startMin-b.startMin);const lanes=[],res=[];evs.forEach(ev=>{let placed=false;for(let i=0;i<lanes.length;i++){const last=lanes[i][lanes[i].length-1];if(ev.startMin>=last.endMin){lanes[i].push(ev);res.push({ev,lane:i});placed=true;break;}}if(!placed){lanes.push([ev]);res.push({ev,lane:lanes.length-1});}});const total=lanes.length;return res.map(({ev,lane})=>({ev,left:lane/total,width:1/total}));}

        function render(){const th=totalHeight();
            syncHeaderHeight();
            renderScale(th);
            renderDays(th);
            renderColorOpts();
            weekLabelDisplay.textContent=currentWeekId.replace('w','第 ')+' 周';}
        function renderScale(th){const h=th*scaleFactor;tsContent.style.height=h+'px';let html='';for(let hh=START_HOUR;hh<=END_HOUR;hh++){const y=minToPixel(hh*60)*scaleFactor;const lb=hh===24?'24:00':`${String(hh).padStart(2,'0')}:00`;html+=`<div class="time-line" style="top:${y}px;"></div>`;html+=`<div class="time-label" style="top:${y}px;">${lb}</div>`;if(hh<END_HOUR){const yHalf=minToPixel(hh*60+30)*scaleFactor;html+=`<div class="time-line half" style="top:${yHalf}px;"></div>`;}}tsContent.innerHTML=html;}
        function renderDays(th){const now=new Date();const today=(now.getDay()+6)%7;let html='';for(let i=0;i<7;i++){const lay=layout(i);let evHtml='';lay.forEach(({ev,left,width})=>{const top=minToPixel(ev.startMin)*scaleFactor;const ht=Math.max((minToPixel(ev.endMin)-minToPixel(ev.startMin))*scaleFactor,14);const color=ev.color||getDefColor();const t=ev.text||'',tag=ev.tag||'',ts=fmtTime(ev.startMin)+'-'+fmtTime(ev.endMin);evHtml+=`<div class="event-block" data-eid="${ev.id}" style="top:${top}px;height:${ht}px;left:${(left*100).toFixed(1)}%;width:${(width*100).toFixed(1)}%;background:${color}22;border-left:3px solid ${color};"><div class="ev-text">${esc(t)}</div><div class="ev-time">${ts}</div>${tag?`<div class="ev-tag" style="font-size:7px;background:rgba(255,255,255,0.6);padding:0 5px;border-radius:20px;margin-top:1px;">${esc(tag)}</div>`:''}</div>`;});const cw=colW(i)*scaleFactor;const tc=i===today?' today':'';html+=`<div class="day-column${tc}" data-day="${i}" style="width:${cw}px;"><div class="day-header-label">${DAY_NAMES[i]}</div><div class="day-track" style="height:${th*scaleFactor}px;position:relative;">${hourLines(th)}${evHtml}</div></div>`;}daysGrid.innerHTML=html;daysGrid.style.height=(th*scaleFactor)+'px';bindTracks();bindEvents();document.querySelectorAll('.day-track').forEach(t=>t.classList.toggle('drag-mode',dragModeActive));dragMask.classList.toggle('active',dragModeActive);}
        function hourLines(th){let s='';for(let h=START_HOUR;h<=END_HOUR;h++){const y=minToPixel(h*60)*scaleFactor;s+=`<div class="hour-line" style="top:${y}px;"></div>`;if(h<END_HOUR){const yHalf=minToPixel(h*60+30)*scaleFactor;s+=`<div class="hour-line half" style="top:${yHalf}px;"></div>`;}}return s;}
        function renderColorOpts(){let h='';COLORS.forEach(c=>{h+=`<div class="color-chip ${c===selectedColor?'active':''}" data-color="${c}" style="background:${c};"></div>`;});colorOptions.innerHTML=h;colorOptions.querySelectorAll('.color-chip').forEach(el=>{el.addEventListener('click',function(){colorOptions.querySelectorAll('.color-chip').forEach(e=>e.classList.remove('active'));this.classList.add('active');selectedColor=this.dataset.color;});});}

        function bindTracks(){
            document.querySelectorAll('.day-track').forEach(track=>{
                const dayIdx=parseInt(track.closest('.day-column').dataset.day);

                track.addEventListener('mousedown',e=>{
                    if(dragModeActive||e.button!==0) return;
                    e.preventDefault();
                    const rect=track.getBoundingClientRect();
                    const logicalY=(e.clientY-rect.top)/scaleFactor;
                    const startMin=Math.max(START_HOUR*60,Math.min(END_HOUR*60,pixelToMin(logicalY)));
                    dragState={dayIdx,track,startY:logicalY,currentY:logicalY,startMin,currentMin:startMin,moved:false,clientStartY:e.clientY};
                    dragPreview.style.display='block';
                    updatePreview();
                    showFloat(e.clientY,fmtTime(startMin));
                    document.addEventListener('mousemove',onMM);
                    document.addEventListener('mouseup',onMU);
                });

                track.addEventListener('touchstart',e=>{
                    if(dragModeActive||e.touches.length!==1) return;
                    e.preventDefault();
                    const t=e.touches[0];
                    const rect=track.getBoundingClientRect();
                    const logicalY=(t.clientY-rect.top)/scaleFactor;
                    const startMin=Math.max(START_HOUR*60,Math.min(END_HOUR*60,pixelToMin(logicalY)));
                    dragState={dayIdx,track,startY:logicalY,currentY:logicalY,startMin,currentMin:startMin,moved:false,isTouch:true,clientStartY:t.clientY};
                },{passive:false});

                track.addEventListener('touchmove',e=>{
                    if(dragModeActive||!dragState||e.touches.length!==1) return;
                    const t=e.touches[0];
                    if(!dragState.moved){
                        const dy=Math.abs(t.clientY-dragState.clientStartY);
                        if(dy>3){
                            dragState.moved=true;
                            dragPreview.style.display='block';
                            updatePreview();
                            showFloat(t.clientY,fmtTime(dragState.startMin));
                        }
                    }
                    if(dragState.moved){
                        updateDrag(t.clientY);
                        e.preventDefault();
                    }
                },{passive:false});

                track.addEventListener('touchend',e=>{
                    if(dragModeActive||!dragState) return;
                    const t=e.changedTouches[0];
                    if(dragState.moved){
                        finishDrag(t.clientY);
                    } else {
                        handleClickAtPoint(t.clientX, t.clientY);
                    }
                    dragState=null;
                    hideFloat();
                },{passive:true});
            });
        }

        function onMM(e){
            if(!dragState) return;
            if(!dragState.moved && Math.abs(e.clientY-dragState.clientStartY)>5) dragState.moved=true;
            if(dragState.moved){
                updateDrag(e.clientY);
                e.preventDefault();
            }
        }
        function onMU(e){
            if(dragState && dragState.moved) {
                finishDrag(e.clientY);
            } else if(dragState) {
                handleClickAtPoint(e.clientX, e.clientY);
                dragPreview.style.display='none';
            }
            dragState=null;
            document.removeEventListener('mousemove',onMM);
            document.removeEventListener('mouseup',onMU);
            hideFloat();
        }

        function handleClickAtPoint(clientX, clientY) {
            const el = document.elementFromPoint(clientX, clientY);
            const eventBlock = el?.closest('.event-block');
            if (eventBlock) {
                eventBlock.click();
            }
        }

        function updateDrag(clientY){
            if(!dragState) return;
            const{track}=dragState;
            const rect=track.getBoundingClientRect();
            const logicalY=Math.max(0,Math.min(totalHeight(),(clientY-rect.top)/scaleFactor));
            dragState.currentY=logicalY;
            dragState.currentMin=Math.max(START_HOUR*60,Math.min(END_HOUR*60,pixelToMin(logicalY)));
            updatePreview();
            showFloat(clientY,fmtTime(dragState.currentMin));
        }

        function finishDrag(clientY){
            if(!dragState) return;
            const{dayIdx,startMin,currentMin}=dragState;
            dragPreview.style.display='none';
            hideFloat();
            const s=Math.min(startMin,currentMin);
            const e=Math.max(startMin,currentMin);
            if(e-s<5){
                toast('⏳ 至少5分钟');
                return;
            }
            const ev={
                id:nextEventId++,
                dayIdx,
                startMin:Math.round(s),
                endMin:Math.round(e),
                text:'',
                color:getDefColor(),
                tag:'',
                lastUpdated:new Date().toISOString()
            };
            addEvent(ev);
            save();
            render();
            openEdit(dayIdx,ev.id);
        }

        function updatePreview(){
            if(!dragState) return;
            const {track, startY, currentY} = dragState;
            const top = Math.min(startY, currentY);
            const bottom = Math.max(startY, currentY);
            const ht = Math.max(bottom - top, 2);

            const col = track.closest('.day-column');
            const headerLabel = col.querySelector('.day-header-label');
            const headerH = headerLabel ? headerLabel.offsetHeight : 0;

            const previewTop = col.offsetTop + headerH + Math.max(0, top) * scaleFactor;
            const previewHeight = Math.min(ht, totalHeight() - top) * scaleFactor;

            dragPreview.style.top = previewTop + 'px';
            dragPreview.style.height = previewHeight + 'px';
            dragPreview.style.left = (col.offsetLeft + 4) + 'px';
            dragPreview.style.width = (col.offsetWidth - 8) + 'px';
            dragPreview.style.display = 'block';
        }

        function showFloat(clientY,str){
            const rect=daysScroll.getBoundingClientRect();
            floatIndicator.style.top=(clientY-30)+'px';
            floatIndicator.style.left=(rect.left+8)+'px';
            floatIndicator.textContent=str;
            floatIndicator.classList.add('active');
        }
        function hideFloat(){
            floatIndicator.classList.remove('active');
        }

        function bindEvents(){
            document.querySelectorAll('.event-block').forEach(el=>{
                el.addEventListener('click',e=>{
                    e.stopPropagation();
                    const di=parseInt(el.closest('.day-column').dataset.day);
                    const id=parseInt(el.dataset.eid);
                    openEdit(di,id);
                });
                el.addEventListener('contextmenu',e=>{
                    e.preventDefault();
                    e.stopPropagation();
                    const di=parseInt(el.closest('.day-column').dataset.day);
                    const id=parseInt(el.dataset.eid);
                    const ev=curEvents()[`${di}-${id}`];
                    if(ev&&confirm(`删除 "${ev.text}" ？`)){
                        rmEvent(di,id);
                        save();
                        render();
                        toast('🗑️ 已删除');
                    }
                });
                let lt;
                el.addEventListener('touchstart',function(){
                    lt=setTimeout(()=>{
                        const di=parseInt(this.closest('.day-column').dataset.day);
                        const id=parseInt(this.dataset.eid);
                        const ev=curEvents()[`${di}-${id}`];
                        if(ev&&confirm(`删除 "${ev.text}" ？`)){
                            rmEvent(di,id);
                            save();
                            render();
                            toast('🗑️ 已删除');
                        }
                    },600);
                },{passive:true});
                el.addEventListener('touchend',()=>clearTimeout(lt));
                el.addEventListener('touchmove',()=>clearTimeout(lt));
            });
        }

        function openEdit(di,id){
            const ev=curEvents()[`${di}-${id}`];
            if(!ev) return;
            editTarget={di,id};
            modalSub.textContent=`${DAY_NAMES[di]} · ${fmtTime(ev.startMin)}-${fmtTime(ev.endMin)}`;
            editText.value=ev.text||'';
            editTag.value=ev.tag||'';
            selectedColor=ev.color||getDefColor();
            renderColorOpts();
            colorOptions.querySelectorAll('.color-chip').forEach(el=>{
                if(el.dataset.color===selectedColor) el.classList.add('active');
            });
            editModal.classList.add('active');
            setTimeout(()=>editText.focus(),100);
        }
        function closeModal(){editModal.classList.remove('active');editTarget=null;}
        function saveEdit(){
            if(!editTarget) return;
            const{di,id}=editTarget;
            const ev=curEvents()[`${di}-${id}`];
            if(!ev){closeModal();return;}
            const text=editText.value.trim(),tag=editTag.value.trim(),color=selectedColor||getDefColor();
            if(!text){
                rmEvent(di,id);
                toast('🗑️ 已删除（空内容）');
            } else {
                ev.text=text;
                ev.tag=tag;
                ev.color=color;
                ev.lastUpdated=new Date().toISOString();
                toast('✅ 已保存');
            }
            save();
            render();
            closeModal();
        }
        function deleteEdit(){
            if(!editTarget) return;
            const{di,id}=editTarget;
            const ev=curEvents()[`${di}-${id}`];
            if(ev&&confirm(`删除 "${ev.text}" ？`)){
                rmEvent(di,id);
                save();
                render();
                toast('🗑️ 已删除');
                closeModal();
            } else {
                closeModal();
            }
        }

        function toggleDrag(){
            dragModeActive=!dragModeActive;
            updateDragUI();
            document.querySelectorAll('.day-track').forEach(t=>t.classList.toggle('drag-mode',dragModeActive));
            dragMask.classList.toggle('active',dragModeActive);
            save();
            toast(dragModeActive?'✋ 拖动模式：手指向下滑→更早时间':'👆 普通模式：向下拖拽创建事件');
        }
        function updateDragUI(){
            if(dragModeActive){
                dragModeBtn.textContent='✋ 拖动中';
                dragModeBtn.classList.add('btn-success');
                dragModeBtn.classList.remove('btn-outline');
            } else {
                dragModeBtn.textContent='✋ 拖动';
                dragModeBtn.classList.remove('btn-success');
                dragModeBtn.classList.add('btn-outline');
            }
        }

        (function(){
            let pan=false,sx=0,sy=0,sl=0,st=0;
            dragMask.addEventListener('mousedown',function(e){
                if(!dragModeActive) return;
                pan=true;sx=e.clientX;sy=e.clientY;
                sl=daysScroll.scrollLeft;st=daysScroll.scrollTop;
                this.style.cursor='grabbing';
                e.preventDefault();
            });
            document.addEventListener('mousemove',function(e){
                if(!pan||!dragModeActive) return;
                daysScroll.scrollLeft = sl + (sx - e.clientX);
                daysScroll.scrollTop = st - (e.clientY - sy);
                e.preventDefault();
            });
            document.addEventListener('mouseup',function(){if(pan){pan=false;dragMask.style.cursor='grab';}});
            dragMask.addEventListener('touchstart',function(e){
                if(!dragModeActive||e.touches.length!==1) return;
                pan=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;
                sl=daysScroll.scrollLeft;st=daysScroll.scrollTop;
            },{passive:true});
            dragMask.addEventListener('touchmove',function(e){
                if(!pan||!dragModeActive||e.touches.length!==1) return;
                const cx=e.touches[0].clientX,cy=e.touches[0].clientY;
                daysScroll.scrollLeft = sl + (sx - cx);
                daysScroll.scrollTop = st - (cy - sy);
                e.preventDefault();
            },{passive:false});
            dragMask.addEventListener('touchend',function(){pan=false;});
        })();

        function setupZoom(){
            zoomSlider.addEventListener('input',function(){
                const val=parseInt(this.value);
                scaleFactor=Math.max(0.5,Math.min(2.5,val/100));
                zoomPercent.textContent=Math.round(scaleFactor*100)+'%';
                if(val===parseInt(zoomSlider.min)){
                    backupW();
                    autoFit();
                } else {
                    restoreW();
                }
                render();
            });
        }
        function changeWeek(delta){
            const n=parseInt(currentWeekId.slice(1))+delta;
            if(n<1){toast('已经是第一周');return;}
            currentWeekId='w'+n;
            if(!weeks[currentWeekId]) weeks[currentWeekId]={};
            save();
            render();
            daysScroll.scrollTop=0;
            daysScroll.scrollLeft=0;
            toast(`${currentWeekId.replace('w','第 ')} 周`);
        }
        function exportData(){
            const p={weeks,currentWeekId,nextEventId,columnWidths,hourHeight,scaleFactor,dragModeActive};
            navigator.clipboard.writeText(JSON.stringify(p, null, 2)).then(() => toast('📤 已复制')).catch(()=>{
                const ta=document.createElement('textarea');
                ta.value=JSON.stringify(p,null,2);
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                toast('📤 已复制');
            });
        }
        function importStr(str){
            try{
                const p=JSON.parse(str);
                if(p.weeks)weeks=p.weeks;
                if(p.currentWeekId)currentWeekId=p.currentWeekId;
                if(p.nextEventId)nextEventId=p.nextEventId;
                if(p.columnWidths)columnWidths=p.columnWidths;
                if(p.hourHeight)hourHeight=p.hourHeight;
                if(p.scaleFactor)scaleFactor=p.scaleFactor;
                if(p.dragModeActive!==undefined)dragModeActive=p.dragModeActive;
                if(!weeks[currentWeekId]) weeks[currentWeekId]={};
                save();
                render();
                toast('✅ 导入成功');
                return true;
            }catch(e){
                toast('❌ JSON 解析失败');
                return false;
            }
        }
        function clearWeek(){
            if(!confirm(`清空 ${currentWeekId.replace('w','第 ')} 周？`)) return;
            weeks[currentWeekId]={};
            save();
            render();
            toast('🗑️ 已清空');
        }

        function setup(){
            modalSaveBtn.addEventListener('click',saveEdit);
            modalCancelBtn.addEventListener('click',closeModal);
            modalDeleteBtn.addEventListener('click',deleteEdit);
            editText.addEventListener('keydown',e=>{
                if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();saveEdit();}
            });
            editModal.addEventListener('click',e=>{if(e.target===editModal) closeModal();});
            importModal.addEventListener('click',e=>{if(e.target===importModal) importModal.classList.remove('active');});
            document.addEventListener('keydown',e=>{
                if(e.key==='Escape'){
                    if(editModal.classList.contains('active')) closeModal();
                    if(importModal.classList.contains('active')) importModal.classList.remove('active');
                }
            });
            importBtn.addEventListener('click',()=>{importModal.classList.add('active');importData.value='';setTimeout(()=>importData.focus(),100);});
            importCancelBtn.addEventListener('click',()=>importModal.classList.remove('active'));
            importConfirmBtn.addEventListener('click',()=>{
                const v=importData.value.trim();
                if(!v){toast('⚠️ 请粘贴数据');return;}
                if(importStr(v)) importModal.classList.remove('active');
            });
            exportBtn.addEventListener('click',exportData);
            clearWeekBtn.addEventListener('click',clearWeek);
            prevWeekBtn.addEventListener('click',()=>changeWeek(-1));
            nextWeekBtn.addEventListener('click',()=>changeWeek(1));
            dragModeBtn.addEventListener('click',toggleDrag);
            setupZoom();
            let rt;
            window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>render(),200);});
        }

        function init(){
            loadColW();
            load();
            if(Math.round(scaleFactor*100)===parseInt(zoomSlider.min)){
                backupW();
                autoFit();
            }
            render();
            setup();
            setTimeout(()=>daysScroll.scrollTop=Math.max(0,minToPixel(8*60)*scaleFactor-100),100);
        }
        init();
    })();
</script>
</body>
</html>
