<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=no" />
    <title>📅 时间轴 · Excel 式缩放 · 流畅拖拽</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f0f5fc;
            color: #1e293b;
            padding: 10px 6px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 1400px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.06);
            padding: 16px 14px 20px;
            display: flex;
            flex-direction: column;
            height: 96vh;
            max-height: 96vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 4px 10px 4px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 650;
            background: linear-gradient(135deg, #1e293b, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }
        .header-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 6px 14px;
            border-radius: 30px;
            border: none;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            background: #f1f5f9;
            color: #1e293b;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            user-select: none;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }
        .btn-primary:active { background: #2563eb; }
        .btn-danger { background: #fee2e2; color: #dc2626; }
        .btn-sm { font-size: 11px; padding: 4px 12px; }
        .week-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8fafc;
            border-radius: 18px;
            padding: 6px 16px;
            margin-bottom: 8px;
            border: 1px solid #eef2f6;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .week-bar .week-nav { display: flex; align-items: center; gap: 6px; }
        .week-bar .week-nav .btn-week {
            padding: 2px 10px;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        .week-bar .week-nav .btn-week:active { background: #eef2ff; }
        .week-bar .week-label {
            font-weight: 600;
            font-size: 15px;
            color: #0f172a;
            min-width: 80px;
            text-align: center;
        }
        .week-bar .week-tools {
            display: flex;
            gap: 6px;
            margin-left: auto;
            flex-wrap: wrap;
            align-items: center;
        }
        .week-bar .week-tools label { font-size: 12px; color: #475569; font-weight: 500; }
        .week-bar .week-tools select {
            padding: 2px 10px;
            border-radius: 30px;
            border: 1.5px solid #e2e8f0;
            font-size: 12px;
            background: white;
            outline: none;
        }
        .week-bar .week-tools input[type="color"] {
            width: 28px; height: 28px;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
            padding: 2px;
            cursor: pointer;
            background: white;
        }
        .day-column.today .day-header-label {
            background: #dbeafe !important;
            color: #1e40af;
            font-weight: 700;
            border-bottom: 2px solid #3b82f6;
        }
        .day-column.today .day-track { background: #f0f9ff; }
        .timeline-container {
            display: flex;
            flex: 1;
            min-height: 0;
            border-radius: 16px;
            border: 1px solid #eef2f6;
            background: #ffffff;
            overflow: hidden;
            position: relative;
            touch-action: pan-x pan-y;  /* 允许双指操作 */
        }
        .time-scale {
            width: 60px;
            min-width: 60px;
            background: #f8fafc;
            border-right: 1px solid #eef2f6;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
            z-index: 1;
            transition: width 0.1s; /* 缩放时过渡宽度 */
        }
        .time-scale-inner {
            position: relative;
            width: 100%;
            transform-origin: top left;
        }
        .time-label {
            position: absolute;
            right: 8px;
            font-size: 10px;
            color: #64748b;
            font-weight: 500;
            transform: translateY(-50%);
            white-space: nowrap;
            letter-spacing: 0.1px;
        }
        .time-label .min { font-weight: 400; font-size: 9px; color: #94a3b8; }
        .float-indicator {
            position: absolute;
            right: -12px;
            transform: translateY(-50%);
            background: #1e293b;
            color: white;
            padding: 3px 10px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            z-index: 50;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .float-indicator::after {
            content: '';
            position: absolute;
            left: -6px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 5px 6px 5px 0;
            border-style: solid;
            border-color: transparent #1e293b transparent transparent;
        }
        .float-indicator.active { opacity: 1; }
        .days-scroll {
            flex: 1;
            overflow: auto;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .days-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .days-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .days-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .days-grid {
            display: flex;
            min-height: 100%;
            position: relative;
            transform-origin: top left;
        }
        .day-column {
            border-right: 1px solid #f1f5f9;
            position: relative;
            background: #ffffff;
            flex-shrink: 0;
        }
        .day-column:last-child { border-right: none; }
        .col-resize-handle {
            position: absolute;
            top: 0;
            right: -3px;
            width: 6px;
            height: 100%;
            cursor: col-resize;
            z-index: 30;
            background: transparent;
            transition: background 0.15s;
        }
        .col-resize-handle:hover,
        .col-resize-handle:active { background: rgba(59, 130, 246, 0.25); }
        .col-resize-handle::after {
            content: '';
            position: absolute;
            top: 0;
            left: 2px;
            width: 2px;
            height: 100%;
            background: #cbd5e1;
            border-radius: 2px;
            transition: background 0.15s;
        }
        .col-resize-handle:hover::after,
        .col-resize-handle:active::after { background: #3b82f6; }
        .day-column .day-header-label {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            padding: 6px 0;
            background: #f8fafc;
            border-bottom: 1px solid #eef2f6;
            position: sticky;
            top: 0;
            z-index: 10;
            letter-spacing: 0.2px;
        }
        .day-track {
            position: relative;
            width: 100%;
            cursor: pointer;
            transform-origin: top left;
        }
        .event-block {
            position: absolute;
            border-radius: 8px;
            padding: 3px 5px;
            font-size: 10px;
            line-height: 1.2;
            color: #1e293b;
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.15s, transform 0.1s;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: center;
            user-select: none;
            z-index: 5;
            min-height: 14px;
        }
        .event-block:active { transform: scale(0.97); }
        .event-block .ev-text { font-weight: 500; font-size: 10px; line-height: 1.2; word-break: break-word; }
        .event-block .ev-time { font-size: 8px; color: #64748b; font-weight: 400; margin-top: 1px; }
        .event-block .ev-tag {
            display: inline-block;
            font-size: 7px;
            background: rgba(255, 255, 255, 0.6);
            padding: 0 5px;
            border-radius: 20px;
            margin-top: 1px;
            align-self: flex-start;
        }
        .drag-preview {
            position: absolute;
            border-radius: 8px;
            background: rgba(59, 130, 246, 0.18);
            border: 2px dashed #3b82f6;
            pointer-events: none;
            z-index: 20;
            display: none;
            transition: none;
            opacity: 0.9;
        }
        .drag-preview.active { display: block; }
        .hour-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: #f1f5f9;
            pointer-events: none;
            z-index: 0;
        }
        .hour-line.half { background: #f8fafc; border-top: 1px dashed #eef2f6; }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active { display: flex; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal {
            background: #ffffff;
            border-radius: 28px;
            padding: 26px 28px 30px;
            width: 380px;
            max-width: 100%;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.18);
            animation: slideUp 0.25s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes slideUp {
            from { transform: translateY(24px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal h3 { font-size: 20px; font-weight: 600; margin-bottom: 2px; color: #0f172a; }
        .modal .modal-sub { font-size: 14px; color: #64748b; margin-bottom: 16px; }
        .modal .form-group { margin-bottom: 14px; }
        .modal .form-group label { display: block; font-size: 13px; font-weight: 500; color: #475569; margin-bottom: 4px; }
        .modal .form-group input,
        .modal .form-group textarea {
            width: 100%;
            padding: 8px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
            resize: vertical;
            background: #fafcff;
        }
        .modal .form-group textarea { min-height: 52px; }
        .modal .form-group input:focus,
        .modal .form-group textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.06);
        }
        .modal .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .modal .form-row .form-group { flex: 1; min-width: 70px; }
        .modal .color-options { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
        .modal .color-options .color-chip {
            width: 30px; height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: 0.12s;
        }
        .modal .color-options .color-chip.active { border-color: #1e293b; transform: scale(1.1); }
        .modal .color-options .color-chip:active { transform: scale(0.9); }
        .modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
        .modal .modal-actions .btn { padding: 8px 22px; font-size: 14px; }
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(24px);
            background: #1e293b;
            color: white;
            padding: 10px 26px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 2000;
            max-width: 90vw;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .import-area textarea {
            width: 100%;
            min-height: 120px;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            padding: 12px;
            font-family: 'Menlo', monospace;
            font-size: 12px;
            resize: vertical;
            outline: none;
        }
        .import-area textarea:focus { border-color: #3b82f6; }
        .import-hint { font-size: 12px; color: #94a3b8; margin-top: 6px; }
        @media (max-width: 700px) {
            .app { padding: 10px 6px 14px; border-radius: 20px; height: 94vh; max-height: 94vh; }
            .header h1 { font-size: 18px; }
            .time-scale { width: 44px; min-width: 44px; }
            .time-label { font-size: 9px; right: 4px; }
            .time-label .min { font-size: 7px; }
            .float-indicator { font-size: 10px; padding: 2px 8px; right: -8px; }
            .float-indicator::after { left: -4px; border-width: 4px 5px 4px 0; }
            .day-column { min-width: 44px; }
            .day-column .day-header-label { font-size: 10px; padding: 4px 0; }
            .event-block { left: 1px; right: 1px; border-radius: 6px; padding: 2px 3px; font-size: 8px; min-height: 12px; }
            .event-block .ev-text { font-size: 8px; }
            .event-block .ev-time { font-size: 7px; }
            .event-block .ev-tag { font-size: 6px; padding: 0 3px; }
            .modal { padding: 20px 16px 24px; width: 100%; max-width: 340px; }
            .week-bar { padding: 4px 12px; gap: 6px; }
            .week-bar .week-label { font-size: 13px; min-width: 60px; }
            .btn { font-size: 11px; padding: 4px 10px; }
            .btn-sm { font-size: 10px; padding: 3px 8px; }
            .col-resize-handle { right: -2px; width: 4px; }
        }
        @media (max-width: 420px) {
            .time-scale { width: 36px; min-width: 36px; }
            .time-label { font-size: 7px; right: 2px; }
            .day-column { min-width: 34px; }
            .day-column .day-header-label { font-size: 8px; padding: 3px 0; }
            .event-block { padding: 1px 2px; font-size: 7px; min-height: 10px; border-radius: 4px; }
            .event-block .ev-text { font-size: 7px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>⏱️ 时间轴 · Excel 缩放</h1>
            <div class="header-actions">
                <button class="btn btn-sm" id="shareUrlBtn">🔗 分享链接</button>
                <button class="btn btn-sm" id="importBtn">📥 导入</button>
                <button class="btn btn-sm" id="exportBtn">📤 导出</button>
                <button class="btn btn-sm btn-danger" id="clearWeekBtn">🗑️ 清空当前周</button>
            </div>
        </header>
        <div class="week-bar">
            <div class="week-nav">
                <button class="btn-week" id="prevWeekBtn">‹ 前周</button>
                <span class="week-label" id="weekLabelDisplay">第 1 周</span>
                <button class="btn-week" id="nextWeekBtn">后周 ›</button>
                <span style="font-size:11px;color:#94a3b8;margin-left:4px;">📏 双指缩放</span>
            </div>
            <div class="week-tools">
                <label>🎨 默认</label>
                <input type="color" id="defaultColor" value="#4f46e5" />
                <label>🔍</label>
                <select id="filterDay">
                    <option value="all">全部</option>
                    <option value="0">周一</option>
                    <option value="1">周二</option>
                    <option value="2">周三</option>
                    <option value="3">周四</option>
                    <option value="4">周五</option>
                    <option value="5">周六</option>
                    <option value="6">周日</option>
                </select>
                <span style="font-size:11px;color:#94a3b8;margin-left:4px;">⋮ 拖拽列边调宽</span>
            </div>
        </div>
        <div class="timeline-container" id="timelineContainer">
            <div class="time-scale" id="timeScale">
                <div class="time-scale-inner" id="timeScaleInner"></div>
                <div class="float-indicator" id="floatIndicator">08:00</div>
            </div>
            <div class="days-scroll" id="daysScroll">
                <div class="days-grid" id="daysGrid"></div>
                <div class="drag-preview" id="dragPreview"></div>
            </div>
        </div>
        <div style="margin-top:6px;font-size:11px;color:#94a3b8;text-align:center;flex-shrink:0;">
            💡 双指缩放（整体缩放）· 拖拽创建 · 点击编辑 · 右键/长按删除 · 分享链接备份
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3 id="modalTitle">📌 编辑事件</h3>
            <div class="modal-sub" id="modalSub">周一 · 08:00-09:30</div>
            <div class="form-group">
                <label>📝 备注</label>
                <textarea id="editText" placeholder="课程/事项" rows="2"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex:1;">
                    <label>🎨 颜色</label>
                    <div class="color-options" id="colorOptions"></div>
                </div>
                <div class="form-group" style="flex:0 0 80px;">
                    <label>🏷️ 标签</label>
                    <input type="text" id="editTag" placeholder="标签" maxlength="8" />
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn" id="modalDeleteBtn" style="color:#dc2626;">🗑️ 删除</button>
                <button class="btn" id="modalCancelBtn">取消</button>
                <button class="btn btn-primary" id="modalSaveBtn">💾 保存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="importModal">
        <div class="modal">
            <h3>📥 导入数据 (JSON)</h3>
            <div class="import-area">
                <textarea id="importData" placeholder='{"weeks":{...}}'></textarea>
                <div class="import-hint">支持 URL 参数 <code>?schedule=...</code> 或分享链接</div>
            </div>
            <div class="modal-actions">
                <button class="btn" id="importCancelBtn">取消</button>
                <button class="btn btn-primary" id="importConfirmBtn">✅ 导入</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  配置
            // ============================================================
            const DAY_NAMES = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            const COLORS = [
                '#4f46e5', '#3b82f6', '#06b6d4', '#10b981', '#f59e0b',
                '#ef4444', '#ec4899', '#8b5cf6', '#14b8a6', '#f97316'
            ];
            const STORAGE_KEY = 'multweek_timeline_v8';
            const LABEL_KEY = 'multweek_current_week_v8';
            const COLWIDTH_KEY = 'multweek_column_widths_v8';
            const HEIGHT_KEY = 'multweek_hour_height_v8';
            const SCALE_KEY = 'multweek_scale_factor_v8';
            const CLEANUP_DAYS = 3;

            const START_HOUR = 6;
            const END_HOUR = 23;
            const TOTAL_MINUTES = (END_HOUR - START_HOUR) * 60;
            const DEFAULT_HOUR_HEIGHT = 80;
            const MIN_SCALE = 0.5;
            const MAX_SCALE = 2.5;

            // ============================================================
            //  状态
            // ============================================================
            let weeks = {};
            let currentWeekId = 'w1';
            let nextEventId = 1;
            let selectedColor = COLORS[0];
            let currentFilter = 'all';
            let columnWidths = {};
            let hourHeight = DEFAULT_HOUR_HEIGHT;   // 逻辑像素（未缩放）
            let scaleFactor = 1;                     // 视图缩放因子

            let isDragging = false;
            let dragDayIdx = null;
            let dragTrack = null;
            let dragStartY = 0;          // 逻辑像素
            let dragCurrentY = 0;
            let dragStartMin = 0;
            let dragCurrentMin = 0;
            let dragStartClientY = 0;
            let dragMoved = false;
            let isTouch = false;

            let isResizing = false;
            let resizeDayIdx = null;
            let resizeStartX = 0;
            let resizeStartWidth = 0;

            let editTarget = null;

            // 双指缩放
            let isPinching = false;
            let initialPinchDist = 0;
            let initialScaleFactor = 1;

            const $ = s => document.querySelector(s);
            const $$ = s => document.querySelectorAll(s);

            const daysGrid = $('#daysGrid');
            const timeScaleInner = $('#timeScaleInner');
            const timeScale = $('#timeScale');
            const daysScroll = $('#daysScroll');
            const dragPreview = $('#dragPreview');
            const floatIndicator = $('#floatIndicator');
            const editModal = $('#editModal');
            const editText = $('#editText');
            const editTag = $('#editTag');
            const modalTitle = $('#modalTitle');
            const modalSub = $('#modalSub');
            const modalSaveBtn = $('#modalSaveBtn');
            const modalCancelBtn = $('#modalCancelBtn');
            const modalDeleteBtn = $('#modalDeleteBtn');
            const colorOptions = $('#colorOptions');
            const defaultColorInput = $('#defaultColor');
            const filterDay = $('#filterDay');
            const importModal = $('#importModal');
            const importData = $('#importData');
            const importConfirmBtn = $('#importConfirmBtn');
            const importCancelBtn = $('#importCancelBtn');
            const importBtn = $('#importBtn');
            const exportBtn = $('#exportBtn');
            const clearWeekBtn = $('#clearWeekBtn');
            const shareUrlBtn = $('#shareUrlBtn');
            const toastEl = $('#toast');
            const weekLabelDisplay = $('#weekLabelDisplay');
            const prevWeekBtn = $('#prevWeekBtn');
            const nextWeekBtn = $('#nextWeekBtn');
            const timelineContainer = $('#timelineContainer');

            // ============================================================
            //  工具函数
            // ============================================================
            function minToPixel(min) {
                return (min - START_HOUR * 60) * (hourHeight / 60);
            }

            function pixelToMin(px) {
                return px * (60 / hourHeight) + START_HOUR * 60;
            }

            function totalHeight() {
                return TOTAL_MINUTES * (hourHeight / 60);
            }

            function formatTime(min) {
                const h = Math.floor(min / 60);
                const m = Math.round(min % 60);
                return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
            }

            function getDefaultColor() {
                return defaultColorInput.value || '#4f46e5';
            }

            function showToast(msg, duration = 2000) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(window._toastTimer);
                window._toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
            }

            function escapeHtml(t) {
                if (!t) return '';
                const d = document.createElement('div');
                d.textContent = t;
                return d.innerHTML;
            }

            function getCurrentEvents() {
                if (!weeks[currentWeekId]) weeks[currentWeekId] = {};
                return weeks[currentWeekId];
            }

            function getEventsForDay(dayIdx) {
                const week = getCurrentEvents();
                return Object.values(week).filter(ev => ev.dayIdx === dayIdx);
            }

            function addEvent(event) {
                const week = getCurrentEvents();
                week[`${event.dayIdx}-${event.id}`] = event;
            }

            function removeEvent(dayIdx, eventId) {
                const week = getCurrentEvents();
                delete week[`${dayIdx}-${eventId}`];
            }

            // ============================================================
            //  自动清理
            // ============================================================
            function cleanupOldEvents() {
                const now = new Date();
                const cutoff = new Date(now);
                cutoff.setDate(cutoff.getDate() - CLEANUP_DAYS);
                cutoff.setHours(0, 0, 0, 0);
                const cutoffTime = cutoff.getTime();
                let cleaned = false;
                Object.keys(weeks).forEach(wkId => {
                    const week = weeks[wkId];
                    if (!week) return;
                    Object.keys(week).forEach(key => {
                        const ev = week[key];
                        if (ev.lastUpdated) {
                            const t = new Date(ev.lastUpdated).getTime();
                            if (t < cutoffTime) {
                                delete week[key];
                                cleaned = true;
                            }
                        }
                    });
                });
                if (cleaned) saveData();
            }

            // ============================================================
            //  保存 / 加载
            // ============================================================
            function saveData() {
                const data = {
                    version: 8,
                    weeks: weeks,
                    currentWeekId: currentWeekId,
                    nextEventId: nextEventId,
                    hourHeight: hourHeight,
                    scaleFactor: scaleFactor,
                    lastUpdated: new Date().toISOString()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                localStorage.setItem(LABEL_KEY, currentWeekId);
            }

            function loadData() {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    try {
                        const parsed = JSON.parse(raw);
                        if (parsed.weeks) weeks = parsed.weeks;
                        if (parsed.currentWeekId) currentWeekId = parsed.currentWeekId;
                        if (parsed.nextEventId) nextEventId = parsed.nextEventId;
                        if (parsed.hourHeight) hourHeight = parsed.hourHeight;
                        if (parsed.scaleFactor) scaleFactor = parsed.scaleFactor;
                    } catch (e) { /* ignore */ }
                }
                if (!weeks[currentWeekId]) weeks[currentWeekId] = {};
                const savedH = localStorage.getItem(HEIGHT_KEY);
                if (savedH) {
                    const h = parseFloat(savedH);
                    if (h >= 30 && h <= 300) hourHeight = h;
                }
                const savedS = localStorage.getItem(SCALE_KEY);
                if (savedS) {
                    const s = parseFloat(savedS);
                    if (s >= 0.3 && s <= 3) scaleFactor = s;
                }
                cleanupOldEvents();
                weekLabelDisplay.textContent = currentWeekId.replace('w', '第 ') + ' 周';
            }

            function saveHourHeight() {
                localStorage.setItem(HEIGHT_KEY, hourHeight.toString());
            }

            function saveScaleFactor() {
                localStorage.setItem(SCALE_KEY, scaleFactor.toString());
            }

            // ---------- 列宽 ----------
            function loadColumnWidths() {
                const raw = localStorage.getItem(COLWIDTH_KEY);
                if (raw) {
                    try { columnWidths = JSON.parse(raw); } catch (e) { columnWidths = {}; }
                }
                for (let i = 0; i < 7; i++) {
                    if (!columnWidths[i]) columnWidths[i] = 120;
                }
            }
            function saveColumnWidths() {
                localStorage.setItem(COLWIDTH_KEY, JSON.stringify(columnWidths));
            }
            function getColWidth(dayIdx) {
                return columnWidths[dayIdx] || 120;
            }

            // ============================================================
            //  堆叠
            // ============================================================
            function layoutEvents(dayIdx) {
                const evs = getEventsForDay(dayIdx);
                if (!evs.length) return [];
                evs.sort((a, b) => a.startMin - b.startMin);
                const lanes = [];
                const assignments = [];
                evs.forEach(ev => {
                    let placed = false;
                    for (let i = 0; i < lanes.length; i++) {
                        const last = lanes[i][lanes[i].length - 1];
                        if (ev.startMin >= last.endMin) {
                            lanes[i].push(ev);
                            assignments.push({ ev, lane: i });
                            placed = true;
                            break;
                        }
                    }
                    if (!placed) {
                        lanes.push([ev]);
                        assignments.push({ ev, lane: lanes.length - 1 });
                    }
                });
                const totalLanes = lanes.length;
                const laneWidth = totalLanes > 0 ? 1 / totalLanes : 1;
                return assignments.map(({ ev, lane }) => {
                    const left = lane * laneWidth;
                    const width = laneWidth;
                    return { ev, left, width };
                });
            }

            // ============================================================
            //  浮动指示器
            // ============================================================
            function showFloatIndicator(clientY, timeStr) {
                const track = getTrackForDay(0);
                if (!track) return;
                const rect = track.getBoundingClientRect();
                const scrollTop = daysScroll.scrollTop;
                // 视觉Y
                let visualY = clientY - rect.top + scrollTop;
                // 转为逻辑Y
                const logicalY = visualY / scaleFactor;
                const pixels = Math.max(0, Math.min(totalHeight(), logicalY));
                floatIndicator.style.top = (pixels * scaleFactor) + 'px'; // 视觉位置
                floatIndicator.textContent = timeStr || formatTime(pixelToMin(pixels));
                floatIndicator.classList.add('active');
            }

            function hideFloatIndicator() {
                floatIndicator.classList.remove('active');
            }

            function updateFloatIndicator(clientY) {
                const track = getTrackForDay(0);
                if (!track) return;
                const trackRect = track.getBoundingClientRect();
                const scrollTop = daysScroll.scrollTop;
                let visualY = clientY - trackRect.top + scrollTop;
                const logicalY = Math.max(0, Math.min(totalHeight(), visualY / scaleFactor));
                const min = Math.max(START_HOUR * 60, Math.min(END_HOUR * 60, pixelToMin(logicalY)));
                const timeStr = formatTime(min);
                floatIndicator.style.top = (logicalY * scaleFactor) + 'px';
                floatIndicator.textContent = timeStr;
                floatIndicator.classList.add('active');
                return min;
            }

            // ============================================================
            //  渲染
            // ============================================================
            function render() {
                renderTimeScale();
                renderDays();
                renderColorOptions();
                weekLabelDisplay.textContent = currentWeekId.replace('w', '第 ') + ' 周';
                applyScaleFactor();
            }

            // 应用缩放因子到容器
            function applyScaleFactor() {
                const innerHeight = totalHeight();
                // 时间刻度容器
                timeScale.style.width = (60 * scaleFactor) + 'px';
                const timeInner = $('#timeScaleInner');
                if (timeInner) {
                    timeInner.style.transform = `scale(${scaleFactor})`;
                    timeInner.style.height = innerHeight + 'px'; // 逻辑高度，transform后视觉高度 = innerHeight * scaleFactor
                }
                // 网格容器
                daysGrid.style.transform = `scale(${scaleFactor})`;
                daysGrid.style.height = innerHeight * scaleFactor + 'px'; // 实际高度让滚动可见
                // 每个day-track的transform在render中通过style应用，但为了整体缩放，我们可以通过父容器间接，但已经通过daysGrid缩放。
                // day-track本身不再需要单独transform。
                // 但注意每个day-track已经设置了高度为逻辑高度，通过父容器缩放后视觉高度正确。
            }

            function renderTimeScale() {
                const totalH = totalHeight();
                let html = '';
                for (let h = START_HOUR; h <= END_HOUR; h++) {
                    const y = minToPixel(h * 60);
                    html += `<div class="time-label" style="top:${y}px;">${String(h).padStart(2,'0')}:00</div>`;
                    if (h < END_HOUR) {
                        const yHalf = minToPixel(h * 60 + 30);
                        html += `<div class="time-label" style="top:${yHalf}px;font-size:8px;color:#b0bcc9;">${String(h).padStart(2,'0')}:30</div>`;
                    }
                }
                timeScaleInner.innerHTML = html;
                timeScaleInner.style.height = totalH + 'px'; // 逻辑高度
            }

            function renderDays() {
                const filtered = currentFilter === 'all' ?
                    DAY_NAMES.map((n, i) => ({ idx: i, name: n })) :
                    DAY_NAMES.map((n, i) => ({ idx: i, name: n })).filter(d => d.idx === parseInt(currentFilter));

                const now = new Date();
                const todayWeekday = (now.getDay() + 6) % 7;

                const totalH = totalHeight();

                let html = '';
                filtered.forEach(day => {
                    const layout = layoutEvents(day.idx);
                    let eventsHtml = '';
                    layout.forEach(({ ev, left, width }) => {
                        const top = minToPixel(ev.startMin);
                        const height = Math.max(minToPixel(ev.endMin) - minToPixel(ev.startMin), 14);
                        const color = ev.color || getDefaultColor();
                        const text = ev.text || '';
                        const tag = ev.tag || '';
                        const timeStr = `${formatTime(ev.startMin)}-${formatTime(ev.endMin)}`;
                        const leftP = (left * 100).toFixed(1);
                        const widthP = (width * 100).toFixed(1);
                        eventsHtml += `
                            <div class="event-block" data-event-id="${ev.id}" 
                                style="top:${top}px;height:${height}px;left:${leftP}%;width:${widthP}%;background:${color}22;border-left:3px solid ${color};">
                                <div class="ev-text">${escapeHtml(text)}</div>
                                <div class="ev-time">${timeStr}</div>
                                ${tag ? `<div class="ev-tag">${escapeHtml(tag)}</div>` : ''}
                            </div>
                        `;
                    });

                    const colWidth = getColWidth(day.idx); // 逻辑宽度
                    const isToday = (day.idx === todayWeekday);
                    const todayClass = isToday ? ' today' : '';
                    // 列宽直接设置逻辑宽度乘以缩放因子
                    html += `
                        <div class="day-column${todayClass}" data-day="${day.idx}" style="width:${colWidth * scaleFactor}px;">
                            <div class="day-header-label">${day.name}</div>
                            <div class="day-track" style="height:${totalH}px;position:relative;">
                                ${renderHourLines(totalH)}
                                ${eventsHtml}
                            </div>
                            <div class="col-resize-handle" data-day="${day.idx}"></div>
                        </div>
                    `;
                });
                daysGrid.innerHTML = html;

                // 应用grid缩放：父容器daysGrid已经通过applyScaleFactor设置了transform
                // 但还需要同步设置day-track的高度（逻辑高度），已在上面设置
                // 同时调整总网格高度
                daysGrid.style.height = totalH * scaleFactor + 'px';

                bindTrackEvents();
                bindEventBlocks();
                bindColumnResize();

                if (currentFilter !== 'all') {
                    document.querySelectorAll('.col-resize-handle').forEach(h => h.style.display = 'none');
                }
            }

            function renderHourLines(totalH) {
                let lines = '';
                for (let h = START_HOUR; h <= END_HOUR; h++) {
                    const y = minToPixel(h * 60);
                    lines += `<div class="hour-line" style="top:${y}px;"></div>`;
                    if (h < END_HOUR) {
                        const yHalf = minToPixel(h * 60 + 30);
                        lines += `<div class="hour-line half" style="top:${yHalf}px;"></div>`;
                    }
                }
                return lines;
            }

            function renderColorOptions() {
                let html = '';
                COLORS.forEach(c => {
                    const active = selectedColor === c ? 'active' : '';
                    html += `<div class="color-chip ${active}" data-color="${c}" style="background:${c};"></div>`;
                });
                colorOptions.innerHTML = html;
                colorOptions.querySelectorAll('.color-chip').forEach(el => {
                    el.addEventListener('click', function() {
                        colorOptions.querySelectorAll('.color-chip').forEach(e => e.classList.remove('active'));
                        this.classList.add('active');
                        selectedColor = this.dataset.color;
                    });
                });
            }

            // ============================================================
            //  单指拖拽创建（改进：带阈值，允许在事件块上拖拽）
            // ============================================================
            function bindTrackEvents() {
                document.querySelectorAll('.day-track').forEach(track => {
                    const dayIdx = parseInt(track.closest('.day-column').dataset.day);

                    track.addEventListener('mousedown', function(e) {
                        if (e.button !== 0) return;
                        if (e.target.closest('.col-resize-handle')) return;
                        startDrag(e.clientY, dayIdx, track, false);
                    });

                    track.addEventListener('touchstart', function(e) {
                        if (e.touches.length !== 1) return;
                        if (e.target.closest('.col-resize-handle')) return;
                        const touch = e.touches[0];
                        dragStartClientY = touch.clientY;
                        dragMoved = false;
                        // 预存信息
                        const rect = track.getBoundingClientRect();
                        const scrollTop = daysScroll.scrollTop;
                        const visualY = touch.clientY - rect.top + scrollTop;
                        const logicalY = visualY / scaleFactor;
                        dragDayIdx = dayIdx;
                        dragTrack = track;
                        dragStartY = logicalY;
                        dragCurrentY = logicalY;
                        dragStartMin = Math.max(START_HOUR * 60, Math.min(END_HOUR * 60, pixelToMin(logicalY)));
                        dragCurrentMin = dragStartMin;
                        isTouch = true;
                        document.addEventListener('touchmove', onTouchMove, { passive: false });
                        document.addEventListener('touchend', onTouchEnd, { passive: false });
                    }, { passive: true });
                });
            }

            // 桌面鼠标移动
            function onMouseMove(e) {
                if (!isDragging) return;
                const delta = Math.abs(e.clientY - dragStartClientY);
                if (!dragMoved && delta > 5) {
                    dragMoved = true;
                    dragPreview.style.display = 'block';
                    updateDragPreview(dragDayIdx, dragTrack);
                    showFloatIndicator(e.clientY, formatTime(dragStartMin));
                }
                if (dragMoved) {
                    updateDragFromClientY(e.clientY);
                    e.preventDefault();
                }
            }

            function onMouseUp(e) {
                if (!isDragging) return;
                finishDrag(e.clientY);
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }

            function onTouchMove(e) {
                if (e.touches.length !== 1) return;
                const touch = e.touches[0];
                const delta = Math.abs(touch.clientY - dragStartClientY);
                if (!dragMoved && delta > 5) {
                    dragMoved = true;
                    isDragging = true;
                    dragPreview.style.display = 'block';
                    updateDragPreview(dragDayIdx, dragTrack);
                    showFloatIndicator(touch.clientY, formatTime(dragStartMin));
                }
                if (dragMoved) {
                    updateDragFromClientY(touch.clientY);
                    e.preventDefault();
                }
            }

            function onTouchEnd(e) {
                if (!dragMoved) {
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                    return;
                }
                const touch = e.changedTouches[0];
                finishDrag(touch.clientY);
                document.removeEventListener('touchmove', onTouchMove);
                document.removeEventListener('touchend', onTouchEnd);
            }

            function startDrag(clientY, dayIdx, track, touch) {
                isDragging = true;
                isTouch = touch;
                dragDayIdx = dayIdx;
                dragTrack = track;
                dragMoved = false;
                dragStartClientY = clientY;
                const rect = track.getBoundingClientRect();
                const scrollTop = daysScroll.scrollTop;
                const visualY = clientY - rect.top + scrollTop;
                const logicalY = visualY / scaleFactor;
                dragStartY = logicalY;
                dragCurrentY = logicalY;
                dragStartMin = Math.max(START_HOUR * 60, Math.min(END_HOUR * 60, pixelToMin(logicalY)));
                dragCurrentMin = dragStartMin;

                if (!touch) {
                    // 桌面立即显示预览
                    dragPreview.style.display = 'block';
                    updateDragPreview(dayIdx, track);
                    showFloatIndicator(clientY, formatTime(dragStartMin));
                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                }
            }

            function updateDragPreview(dayIdx, track) {
                const top = Math.min(dragStartY, dragCurrentY);
                const bottom = Math.max(dragStartY, dragCurrentY);
                const height = Math.max(bottom - top, 2);
                const col = track.closest('.day-column');
                const colLeft = col.offsetLeft;
                const colWidth = col.offsetWidth;
                // 这些值已经是逻辑像素，但预览应该以视觉像素显示
                dragPreview.style.top = (Math.max(0, top) * scaleFactor) + 'px';
                dragPreview.style.height = (Math.min(height, totalHeight() - top) * scaleFactor) + 'px';
                dragPreview.style.left = (colLeft + 4) + 'px';
                dragPreview.style.width = (colWidth - 8) + 'px';
                dragPreview.style.display = 'block';
            }

            function updateDragFromClientY(clientY) {
                if (!dragTrack) return;
                const rect = dragTrack.getBoundingClientRect();
                const scrollTop = daysScroll.scrollTop;
                let visualY = clientY - rect.top + scrollTop;
                const logicalY = Math.max(0, Math.min(totalHeight(), visualY / scaleFactor));
                dragCurrentY = logicalY;
                dragCurrentMin = Math.max(START_HOUR * 60, Math.min(END_HOUR * 60, pixelToMin(logicalY)));
                updateDragPreview(dragDayIdx, dragTrack);
                showFloatIndicator(clientY, formatTime(dragCurrentMin));
            }

            function finishDrag(clientY) {
                if (!isDragging) return;
                isDragging = false;
                dragPreview.style.display = 'none';
                hideFloatIndicator();

                const startMin = Math.min(dragStartMin, dragCurrentMin);
                const endMin = Math.max(dragStartMin, dragCurrentMin);
                if (endMin - startMin < 5) {
                    showToast('⏳ 拖拽太短，至少5分钟');
                    dragDayIdx = null;
                    dragTrack = null;
                    return;
                }

                const dayIdx = dragDayIdx;
                const ev = {
                    id: nextEventId++,
                    dayIdx: dayIdx,
                    startMin: Math.round(startMin),
                    endMin: Math.round(endMin),
                    text: '',
                    color: getDefaultColor(),
                    tag: '',
                    lastUpdated: new Date().toISOString()
                };
                addEvent(ev);
                saveData();
                render();
                openEditModal(dayIdx, ev.id);
                dragDayIdx = null;
                dragTrack = null;
            }

            function getTrackForDay(dayIdx) {
                const col = document.querySelector(`.day-column[data-day="${dayIdx}"]`);
                if (!col) return null;
                return col.querySelector('.day-track');
            }

            // ============================================================
            //  事件块交互（点击编辑 / 长按删除）
            // ============================================================
            function bindEventBlocks() {
                document.querySelectorAll('.event-block').forEach(block => {
                    block.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const dayIdx = parseInt(this.closest('.day-column').dataset.day);
                        const eventId = parseInt(this.dataset.eventId);
                        openEditModal(dayIdx, eventId);
                    });
                    block.addEventListener('contextmenu', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        const dayIdx = parseInt(this.closest('.day-column').dataset.day);
                        const eventId = parseInt(this.dataset.eventId);
                        const week = getCurrentEvents();
                        const ev = week[`${dayIdx}-${eventId}`];
                        if (ev && confirm(`删除 "${ev.text}" ？`)) {
                            removeEvent(dayIdx, eventId);
                            saveData();
                            render();
                            showToast('🗑️ 已删除');
                        }
                    });
                    let longTimer;
                    block.addEventListener('touchstart', function(e) {
                        longTimer = setTimeout(() => {
                            const dayIdx = parseInt(this.closest('.day-column').dataset.day);
                            const eventId = parseInt(this.dataset.eventId);
                            const week = getCurrentEvents();
                            const ev = week[`${dayIdx}-${eventId}`];
                            if (ev && confirm(`删除 "${ev.text}" ？`)) {
                                removeEvent(dayIdx, eventId);
                                saveData();
                                render();
                                showToast('🗑️ 已删除');
                            }
                        }, 600);
                    }, { passive: true });
                    block.addEventListener('touchend', function() { clearTimeout(longTimer); });
                    block.addEventListener('touchmove', function() { clearTimeout(longTimer); });
                });
            }

            // ============================================================
            //  列宽调整（未缩放时的逻辑宽度）
            // ============================================================
            function bindColumnResize() {
                document.querySelectorAll('.col-resize-handle').forEach(handle => {
                    handle.addEventListener('mousedown', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        const dayIdx = parseInt(this.dataset.day);
                        startResize(e.clientX, dayIdx);
                    });
                    handle.addEventListener('touchstart', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        const touch = e.touches[0];
                        const dayIdx = parseInt(this.dataset.day);
                        startResize(touch.clientX, dayIdx);
                    }, { passive: false });
                });
            }

            function startResize(clientX, dayIdx) {
                isResizing = true;
                resizeDayIdx = dayIdx;
                resizeStartX = clientX;
                resizeStartWidth = getColWidth(dayIdx); // 逻辑宽度
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';

                document.addEventListener('mousemove', onResizeMove);
                document.addEventListener('mouseup', onResizeEnd);
                document.addEventListener('touchmove', onResizeTouchMove, { passive: false });
                document.addEventListener('touchend', onResizeTouchEnd);
            }

            function onResizeMove(e) {
                if (!isResizing) return;
                const delta = e.clientX - resizeStartX;
                applyResize(delta);
                e.preventDefault();
            }

            function onResizeTouchMove(e) {
                if (!isResizing) return;
                const touch = e.touches[0];
                const delta = touch.clientX - resizeStartX;
                applyResize(delta);
                e.preventDefault();
            }

            function applyResize(delta) {
                const dayIdx = resizeDayIdx;
                let newWidth = Math.max(50, resizeStartWidth + delta / scaleFactor); // 缩放后，视觉移动距离需要除以缩放因子以得到逻辑宽度变化
                newWidth = Math.min(400, newWidth);
                columnWidths[dayIdx] = Math.round(newWidth);
                // 立即更新该列宽度
                const col = document.querySelector(`.day-column[data-day="${dayIdx}"]`);
                if (col) col.style.width = (newWidth * scaleFactor) + 'px'; // 视觉宽度
                saveColumnWidths();
            }

            function onResizeEnd() {
                if (!isResizing) return;
                isResizing = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                document.removeEventListener('mousemove', onResizeMove);
                document.removeEventListener('mouseup', onResizeEnd);
                document.removeEventListener('touchmove', onResizeTouchMove);
                document.removeEventListener('touchend', onResizeTouchEnd);
            }

            function onResizeTouchEnd() { onResizeEnd(); }

            // ============================================================
            //  双指缩放（整体缩放，包含表头列宽）
            // ============================================================
            function setupPinch() {
                let startDistance = 0;
                let startScale = scaleFactor;

                timelineContainer.addEventListener('touchstart', function(e) {
                    if (e.touches.length === 2) {
                        isPinching = true;
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        startDistance = Math.hypot(dx, dy);
                        startScale = scaleFactor;
                        e.preventDefault(); // 阻止页面缩放
                    }
                }, { passive: false });

                timelineContainer.addEventListener('touchmove', function(e) {
                    if (isPinching && e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        const currentDistance = Math.hypot(dx, dy);
                        const scale = currentDistance / startDistance;
                        let newScale = startScale * scale;
                        newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
                        if (Math.abs(newScale - scaleFactor) > 0.01) {
                            scaleFactor = newScale;
                            applyScaleFactor();
                            // 同时更新列宽（视觉宽度）
                            document.querySelectorAll('.day-column').forEach(col => {
                                const dayIdx = parseInt(col.dataset.day);
                                col.style.width = (getColWidth(dayIdx) * scaleFactor) + 'px';
                            });
                            // 更新时间尺度宽度
                            timeScale.style.width = (60 * scaleFactor) + 'px';
                            // 更新网格高度
                            const totalH = totalHeight();
                            daysGrid.style.height = totalH * scaleFactor + 'px';
                            // 浮动指示器位置不变，但需要重新计算坐标？floatIndicator是绝对定位在time-scale中，其top已经是视觉像素，不变。
                            // 但指示器显示的时间需要重新计算？不需要，它显示的是逻辑时间。
                            saveScaleFactor();
                        }
                        e.preventDefault();
                    }
                }, { passive: false });

                timelineContainer.addEventListener('touchend', function(e) {
                    if (e.touches.length < 2) {
                        isPinching = false;
                    }
                });
            }

            // ============================================================
            //  编辑弹窗
            // ============================================================
            function openEditModal(dayIdx, eventId) {
                const week = getCurrentEvents();
                const ev = week[`${dayIdx}-${eventId}`];
                if (!ev) { showToast('⚠️ 事件不存在'); return; }
                editTarget = { dayIdx, eventId };
                modalTitle.textContent = '📌 编辑事件';
                modalSub.textContent = `${DAY_NAMES[dayIdx]} · ${formatTime(ev.startMin)}-${formatTime(ev.endMin)}`;

                editText.value = ev.text || '';
                editTag.value = ev.tag || '';
                selectedColor = ev.color || getDefaultColor();

                renderColorOptions();
                colorOptions.querySelectorAll('.color-chip').forEach(el => {
                    if (el.dataset.color === selectedColor) el.classList.add('active');
                });

                modalDeleteBtn.style.display = 'inline-flex';
                editModal.classList.add('active');
                setTimeout(() => editText.focus(), 100);
            }

            function closeModal() {
                editModal.classList.remove('active');
                editTarget = null;
            }

            function saveEdit() {
                if (!editTarget) return;
                const { dayIdx, eventId } = editTarget;
                const week = getCurrentEvents();
                const ev = week[`${dayIdx}-${eventId}`];
                if (!ev) { closeModal(); return; }

                const text = editText.value.trim();
                const tag = editTag.value.trim();
                const color = selectedColor || getDefaultColor();

                if (!text) {
                    removeEvent(dayIdx, eventId);
                    showToast('🗑️ 已删除（空内容）');
                } else {
                    ev.text = text;
                    ev.tag = tag;
                    ev.color = color;
                    ev.lastUpdated = new Date().toISOString();
                    showToast('✅ 已保存');
                }
                saveData();
                render();
                closeModal();
            }

            function deleteEdit() {
                if (!editTarget) return;
                const { dayIdx, eventId } = editTarget;
                const week = getCurrentEvents();
                const ev = week[`${dayIdx}-${eventId}`];
                if (ev && confirm(`删除 "${ev.text}" ？`)) {
                    removeEvent(dayIdx, eventId);
                    saveData();
                    render();
                    showToast('🗑️ 已删除');
                    closeModal();
                } else {
                    closeModal();
                }
            }

            // ============================================================
            //  周切换
            // ============================================================
            function changeWeek(delta) {
                const num = parseInt(currentWeekId.slice(1));
                const newNum = num + delta;
                if (newNum < 1) { showToast('已经是第一周'); return; }
                const newId = 'w' + newNum;
                if (!weeks[newId]) weeks[newId] = {};
                currentWeekId = newId;
                saveData();
                render();
                daysScroll.scrollTop = 0;
                showToast(`切换到 ${newId.replace('w', '第 ')} 周`);
            }

            // ============================================================
            //  导入导出 / 分享URL
            // ============================================================
            function exportData() {
                const payload = {
                    version: 8,
                    weeks: weeks,
                    currentWeekId: currentWeekId,
                    nextEventId: nextEventId,
                    columnWidths: columnWidths,
                    hourHeight: hourHeight,
                    scaleFactor: scaleFactor,
                    lastUpdated: new Date().toISOString()
                };
                const json = JSON.stringify(payload, null, 2);
                navigator.clipboard.writeText(json).then(() => showToast('📤 已复制')).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = json;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast('📤 已复制');
                });
            }

            function importFromString(str) {
                try {
                    const parsed = JSON.parse(str);
                    if (parsed.weeks) weeks = parsed.weeks;
                    if (parsed.currentWeekId) currentWeekId = parsed.currentWeekId;
                    if (parsed.nextEventId) nextEventId = parsed.nextEventId;
                    if (parsed.columnWidths) columnWidths = parsed.columnWidths;
                    if (parsed.hourHeight) hourHeight = parsed.hourHeight;
                    if (parsed.scaleFactor) scaleFactor = parsed.scaleFactor;
                    if (!weeks[currentWeekId]) weeks[currentWeekId] = {};
                    saveData();
                    saveColumnWidths();
                    saveHourHeight();
                    saveScaleFactor();
                    render();
                    showToast('✅ 导入成功');
                    return true;
                } catch (e) {
                    showToast('❌ JSON 解析失败');
                    return false;
                }
            }

            function getShareableURL() {
                const payload = {
                    version: 8,
                    weeks: weeks,
                    currentWeekId: currentWeekId,
                    nextEventId: nextEventId,
                    columnWidths: columnWidths,
                    hourHeight: hourHeight,
                    scaleFactor: scaleFactor,
                    lastUpdated: new Date().toISOString()
                };
                const json = JSON.stringify(payload);
                const encoded = encodeURIComponent(json);
                const url = window.location.origin + window.location.pathname + '?schedule=' + encoded;
                return url;
            }

            function copyShareableURL() {
                const url = getShareableURL();
                navigator.clipboard.writeText(url).then(() => {
                    showToast('🔗 链接已复制，分享即可还原全部数据');
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = url;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast('🔗 链接已复制');
                });
            }

            function parseURLParams() {
                const params = new URLSearchParams(window.location.search);
                const schedule = params.get('schedule');
                if (schedule) {
                    try {
                        const decoded = decodeURIComponent(schedule);
                        importFromString(decoded);
                        showToast('📥 已从 URL 导入数据');
                    } catch (e) { showToast('⚠️ URL 参数无效'); }
                }
            }

            function clearCurrentWeek() {
                if (!confirm(`⚠️ 确定清空 ${currentWeekId.replace('w', '第 ')} 周的所有事件？`)) return;
                weeks[currentWeekId] = {};
                saveData();
                render();
                showToast('🗑️ 已清空当前周');
            }

            // ============================================================
            //  UI 事件绑定
            // ============================================================
            function setupEvents() {
                modalSaveBtn.addEventListener('click', saveEdit);
                modalCancelBtn.addEventListener('click', closeModal);
                modalDeleteBtn.addEventListener('click', deleteEdit);
                editText.addEventListener('keydown', e => {
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(); }
                });

                defaultColorInput.addEventListener('input', render);
                filterDay.addEventListener('change', () => {
                    currentFilter = filterDay.value;
                    render();
                    daysScroll.scrollTop = 0;
                });

                importBtn.addEventListener('click', () => {
                    importModal.classList.add('active');
                    importData.value = '';
                    setTimeout(() => importData.focus(), 100);
                });
                importCancelBtn.addEventListener('click', () => importModal.classList.remove('active'));
                importConfirmBtn.addEventListener('click', () => {
                    const val = importData.value.trim();
                    if (!val) { showToast('⚠️ 请粘贴数据'); return; }
                    if (importFromString(val)) importModal.classList.remove('active');
                });

                exportBtn.addEventListener('click', exportData);
                shareUrlBtn.addEventListener('click', copyShareableURL);
                clearWeekBtn.addEventListener('click', clearCurrentWeek);

                prevWeekBtn.addEventListener('click', () => changeWeek(-1));
                nextWeekBtn.addEventListener('click', () => changeWeek(1));

                editModal.addEventListener('click', e => { if (e.target === editModal) closeModal(); });
                importModal.addEventListener('click', e => { if (e.target === importModal) importModal.classList.remove('active'); });
                document.addEventListener('keydown', e => {
                    if (e.key === 'Escape') {
                        if (editModal.classList.contains('active')) closeModal();
                        if (importModal.classList.contains('active')) importModal.classList.remove('active');
                    }
                });

                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => render(), 200);
                });
            }

            // ============================================================
            //  初始化
            // ============================================================
            function init() {
                loadColumnWidths();
                loadData();
                parseURLParams();
                render();
                setupEvents();
                setupPinch();
                filterDay.value = 'all';
                showToast('✨ 双指缩放 (整体缩放) · 拖拽创建流畅', 2000);
                setTimeout(() => {
                    const scrollTarget = minToPixel(8 * 60) * scaleFactor;
                    daysScroll.scrollTop = Math.max(0, scrollTarget - 100);
                }, 100);
            }

            init();

        })();
    </script>
</body>
</html>
